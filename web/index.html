<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#087f83">
  <title>科研工作台</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=260923">
  <link rel="apple-touch-icon" href="/favicon.png?v=260923">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/v260922-projects.css">
  <link rel="stylesheet" href="/v260922-compact-layout.css">
  <link rel="stylesheet" href="/v260922-overview-editor-tools.css">
  <link rel="stylesheet" href="/v260922-performance.css">
  <link rel="stylesheet" href="/v260922-graph-performance.css">
  <link rel="stylesheet" href="/v260922-agent-profiles.css">
  <link rel="stylesheet" href="/v260922-layout-bugfixes.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css'">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$','$$'], ['\\[','\\]']],
        processEscapes: true,
        packages: {'[+]': ['ams']}
      },
      options: {skipHtmlTags: ['script','noscript','style','textarea','pre','code']}
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js'"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/marked@15.0.12/marked.min.js'"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js'"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js'"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/mermaid@11.4.1/dist/mermaid.min.js'"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span></span></div>
        <div class="brand-copy">
          <h1 id="brand-title">科研工作台</h1>
          <p id="brand-subtitle">Engineering Research Workspace</p>
        </div>
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="workspace-mini" id="workspace-mini">Workspace · 初始化中</div>
        <div class="version">Standalone · <span id="version-label">v1.0</span></div>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="page-heading">
          <div class="eyebrow" id="page-eyebrow">CORE WORK</div>
          <h2 id="page-title">概览</h2>
          <div class="page-date" id="page-date"></div>
        </div>
        <div class="top-actions">
          <button class="top-search-btn" id="global-search-btn" type="button" title="全局搜索 · Ctrl/⌘ K"><span>⌕</span><span>搜索</span><kbd>⌘K</kbd></button>
          <button class="weather-pill" id="weather-pill" type="button" title="天气详情">
            <span class="status-dot"></span><span id="weather-text">天气加载中</span>
          </button>
          <button class="icon-btn" id="theme-btn" type="button" title="切换主题">◐</button>
          <button class="density-pill" id="density-btn" type="button" title="当前：紧凑型（热力图与学业卡并排、一屏收纳免滚动）。点击切换为宽松型">紧凑型</button>
          <div class="zoom-wrap">
            <button class="zoom-pill" id="zoom-btn" type="button" title="界面缩放">100%</button>
            <div class="dropdown hidden" id="zoom-menu">
              <button type="button" data-zoom="80">80% · 紧凑</button>
              <button type="button" data-zoom="90">90% · 偏小</button>
              <button type="button" data-zoom="100">100% · 默认</button>
              <button type="button" data-zoom="110">110% · 偏大</button>
              <button type="button" data-zoom="125">125% · 宽松</button>
            </div>
          </div>
          <div class="reload-wrap">
            <button class="primary-btn reload-btn" id="reload-btn" type="button" title="重新读取所有配置并刷新本地缓存">↻ Reload</button>
            <button class="primary-btn reload-menu-btn" id="reload-menu-btn" type="button" aria-label="Reload 菜单">⌄</button>
            <div class="dropdown hidden" id="reload-menu">
              <button type="button" data-system-action="reload">Reload 全部配置</button>
              <button type="button" data-system-action="restart">快速重启服务</button>
            </div>
          </div>
        </div>
      </header>
      <main id="main" class="main-content"></main>
    </div>
  </div>

  <div class="toast-stack" id="toast-stack"></div>
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><h3 id="modal-title">操作</h3><button type="button" class="icon-btn" id="modal-close">×</button></header>
      <div class="modal-body" id="modal-body"></div>
      <footer id="modal-footer"></footer>
    </section>
  </div>

  <script defer src="/v260922-performance.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/v260922-projects.js"></script>
  <script defer src="/v260922-overview-editor-tools.js"></script>
  <script defer src="/v260922-graph-performance.js"></script>
  <script defer src="/v260922-overview-graph.js"></script>
  <script defer src="/v260922-agent-profiles.js"></script>
  <script defer src="/v260922-layout-bugfixes.js"></script>
</body>
</html>
